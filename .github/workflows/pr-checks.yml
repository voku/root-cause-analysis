name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Static checks
        run: npm run lint
      - name: Exercise D3 graph and timeline primitives
        run: node --test tests/d3-graph-smoke.test.mjs
      - name: Production build
        run: npm run build
      - name: Verify output
        run: test -f dist/index.html
